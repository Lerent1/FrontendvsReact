<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const num = [1, 2, 2, 3, 4, 5, 6];
        function check(arr, t, callback){
            let list = [];
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] == t) {
                    list[i] = arr[i];
                }
            }
            callback(list);
        }
        function callback(arr) {
            console.log(arr);
        }
        check(num, 2, callback);
    </script>
</body>
</html>
