<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const num = [1, 2, 3, 4, 5, 6];
        function arr(num, callback){
            for (let i = 0; i < num.length; i++) {
                callback(i, num[i], num);
            }
        }

        function callback(index, value, num){
            console.log(`Vi tri: ${index}, phan tu: ${value}, mang: [${num}]`);   
        }
        arr(num, callback);
    </script>
</body>
</html>
