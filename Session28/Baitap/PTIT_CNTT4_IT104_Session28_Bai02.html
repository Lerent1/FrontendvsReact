<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function delayedCallback(callBack, delay) {
            setTimeout(() => {
                callBack();
            }, delay)
        }
        let time = +prompt("Hay nhap thoi gian bat ki");
        const timer = (param) => {
            console.log("Ham goi sau", param);
        }
        delayedCallback(timer, time);
    </script>
</body>
</html>
