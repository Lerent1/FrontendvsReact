<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let count = 0;
            function processArray(callback, num){
                setTimeout(() => {
                    callback();
                }, num * 1000)
            }
            function callback() {
                console.log("so thu tu: " + (++count));
                processArray(callback, num)
            }
            let num = +prompt("Hay nhap thoi gian delay: ");
            processArray(callback, num);
    </script>
</body>
</html>
